<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BIOL 1414 Lecture 4 Quiz</title>
    <meta name="description" content="One-question-at-a-time quiz for BIOL 1414 Lecture 4." />
    <meta name="theme-color" content="#1B365D" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500&family=Source+Sans+3:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #f3efe6;
        --surface: #fffdf8;
        --ink: #1a2330;
        --muted: #5c6570;
        --line: #d8d1c4;
        --navy: #1b365d;
        --teal: #0d5c5f;
        --display: "Fraunces", "Times New Roman", serif;
        --sans: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
        --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; }
      body {
        background: var(--bg);
        color: var(--ink);
        font-family: var(--sans);
        line-height: 1.5;
        background-image:
          radial-gradient(1200px 600px at 10% -10%, color-mix(in oklab, var(--navy) 6%, transparent), transparent 60%),
          radial-gradient(900px 500px at 110% 10%, color-mix(in oklab, var(--teal) 7%, transparent), transparent 55%);
      }
      button:not(:disabled), [role="button"]:not(:disabled) { cursor: pointer; }
      .wrap { max-width: 42rem; margin: 0 auto; min-height: 100dvh; padding: 1.5rem 1rem; display: flex; flex-direction: column; }
      header { display: flex; justify-content: space-between; align-items: flex-end; gap: 1rem; margin-bottom: 1.25rem; }
      .kicker { font-size: 0.75rem; font-weight: 600; letter-spacing: 0.18em; text-transform: uppercase; color: var(--teal); margin: 0; }
      h1 { font-family: var(--display); font-size: clamp(1.5rem, 4vw, 1.875rem); font-weight: 500; letter-spacing: -0.03em; color: var(--navy); margin: 0.15rem 0 0; }
      .count { font-family: var(--mono); font-size: 0.875rem; color: var(--muted); }
      .bar { height: 4px; background: var(--line); border-radius: 999px; overflow: hidden; margin-bottom: 1.25rem; }
      .bar > span { display: block; height: 100%; background: var(--teal); width: 0; transition: width 250ms cubic-bezier(0.22,1,0.36,1); }
      .card { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 1.5rem; box-shadow: 0 12px 40px -24px rgba(27,54,93,0.45); }
      .muted { color: var(--muted); }
      .prompt { font-family: var(--display); font-size: 1.35rem; line-height: 1.25; color: var(--navy); margin: 0.4rem 0 1.25rem; }
      .choices { display: grid; gap: 0.5rem; }
      label.opt { display: flex; gap: 0.75rem; align-items: flex-start; min-height: 44px; border: 1px solid var(--line); border-radius: 12px; padding: 0.75rem; background: var(--bg); }
      label.opt.selected { border-color: var(--teal); background: color-mix(in oklab, var(--teal) 8%, white); }
      label.opt span.letter { font-family: var(--mono); font-weight: 500; color: var(--navy); }
      textarea, select { width: 100%; min-height: 44px; border: 1px solid var(--line); border-radius: 12px; background: var(--bg); color: var(--ink); font: inherit; padding: 0.75rem; }
      textarea { min-height: 8rem; resize: vertical; }
      .row { display: flex; justify-content: space-between; align-items: center; gap: 0.75rem; margin-top: 2rem; }
      .btn { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; min-width: 7rem; padding: 0 1.1rem; border: 0; border-radius: 12px; font: 500 0.9rem var(--sans); color: var(--surface); background: var(--navy); }
      .btn.teal { background: var(--teal); }
      .btn.ghost { background: transparent; color: var(--muted); min-width: auto; }
      .btn.outline { background: var(--bg); color: var(--navy); border: 1px solid var(--line); }
      .btn:disabled { background: var(--muted); }
      .list { font-family: var(--mono); font-size: 1rem; line-height: 1.7; margin: 1.25rem 0 0; padding: 0; list-style: none; }
      .match { display: grid; gap: 1rem; }
      .match-row { display: grid; gap: 0.4rem; }
      @media (min-width: 640px) {
        .wrap { padding: 2.5rem 1.5rem; }
        .card { padding: 2rem; }
        .match-row { grid-template-columns: 1fr auto; align-items: center; }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <div>
          <p class="kicker">BIOL 1414</p>
          <h1>Lecture 4 Quiz</h1>
        </div>
        <p class="count" id="count" hidden></p>
      </header>
      <div class="bar" id="barwrap" hidden><span id="bar"></span></div>
      <main id="main"></main>
    </div>
    <script>
      const QUESTIONS = [
        { id: 1, type: "choice", prompt: "The atomic number of an element is determined by the number of:", choices: [
          ["A","Neutrons"],["B","Protons"],["C","Electrons"],["D","Protons + neutrons"]
        ]},
        { id: 2, type: "choice", prompt: "Carbon-13 and carbon-14 are isotopes of each other because they have:", choices: [
          ["A","Different numbers of protons"],["B","The same number of neutrons"],["C","The same number of protons but different numbers of neutrons"],["D","Different atomic numbers"]
        ]},
        { id: 3, type: "choice", prompt: "Chlorine’s atomic mass is about 35.45. The best explanation is:", choices: [
          ["A","Every chlorine atom has 18.45 neutrons"],["B","Atomic mass is protons only"],["C","Atomic mass is a weighted average of chlorine isotopes"],["D","Electrons add substantial mass"]
        ]},
        { id: 4, type: "choice", prompt: "True or false: Electrons contribute substantially to an atom’s mass (weight) as well as to its charge.", choices: [["A","True"],["B","False"]] },
        { id: 5, type: "short", prompt: "In a balanced chemical equation, reactants appear on the _____ of the arrow and products on the _____.", placeholder: "e.g. left; right" },
        { id: 6, type: "choice", prompt: "A sodium atom that loses one electron becomes:", choices: [
          ["A","An anion"],["B","A cation"],["C","A neutron"],["D","A nonpolar molecule"]
        ]},
        { id: 7, type: "choice", prompt: "Which statement about ionic bonds is most accurate?", choices: [
          ["A","They form when atoms share three electron pairs"],["B","They form between ions of opposite charge"],["C","They are the most common bonds inside living cells"],["D","They only occur in gases"]
        ]},
        { id: 8, type: "choice", prompt: "Sharing two pairs of electrons produces a:", choices: [
          ["A","Hydrogen bond"],["B","Single covalent bond"],["C","Double covalent bond"],["D","Ionic lattice"]
        ]},
        { id: 9, type: "choice", prompt: "Water is a polar covalent molecule because:", choices: [
          ["A","O and H share electrons equally"],["B","Electrons spend more time nearer oxygen than hydrogen"],["C","Water has a net charge of +1"],["D","The O–H bonds are ionic"]
        ]},
        { id: 10, type: "short", prompt: "Why is atmospheric nitrogen (about 78% of air) still “limiting” for many ecosystems?", placeholder: "2–3 sentences" },
        { id: 11, type: "choice", prompt: "A hydrogen bond is best described as:", choices: [
          ["A","Sharing of electrons between H and O inside one water molecule"],["B","Transfer of an electron from H to O"],["C","Attraction between a slightly positive H on one molecule and a slightly negative region on another"],["D","A triple covalent bond"]
        ]},
        { id: 12, type: "short", prompt: "Oil does not mix with vinegar because oil is _____ and vinegar is a polar (aqueous) solution.", placeholder: "e.g. hydrophobic / nonpolar" },
        { id: 13, type: "choice", prompt: "Ice floats because:", choices: [
          ["A","Ice molecules move faster than liquid water"],["B","Hydrogen bonds in ice hold molecules farther apart, so ice is less dense"],["C","Ice has more neutrons"],["D","Water loses mass when it freezes"]
        ]},
        { id: 14, type: "match", prompt: "Match the property to the definition.", items: [
          ["1","Cohesion"],["2","Adhesion"],["3","Specific heat"],["4","Heat of vaporization"]
        ], options: [
          ["A","Water climbs a charged glass wall"],["B","Energy to raise 1 g of substance by 1 °C"],["C","Water molecules attract one another"],["D","Energy to convert 1 g of liquid to gas"]
        ]},
        { id: 15, type: "choice", prompt: "True or false: Most chemical reactions of life occur in water because water is an excellent solvent for polar molecules and ionic compounds.", choices: [["A","True"],["B","False"]] },
        { id: 16, type: "choice", prompt: "Human blood is about pH 7.4. Orange juice is about pH 3. People survive drinking juice mainly because:", choices: [
          ["A","The stomach never contacts the juice"],["B","Buffers absorb extra H+ or OH− and hold body pH in a narrow range"],["C","pH 3 is basic"],["D","Juice contains no hydrogen ions"]
        ]},
        { id: 17, type: "short", prompt: "Stomach pH is about 1–2. How do stomach-lining cells persist in that environment, according to lecture?", placeholder: "Short answer" },
        { id: 18, type: "choice", prompt: "Carbon is the backbone of biological molecules because it:", choices: [
          ["A","Forms only ionic bonds"],["B","Has four valence electrons and can form four covalent bonds, including to other carbons"],["C","Cannot form double or triple bonds"],["D","Has a full outer shell already"]
        ]},
        { id: 19, type: "choice", prompt: "Butane and isobutane have the same formula but different structures. They are:", choices: [
          ["A","Isotopes"],["B","Ions"],["C","Isomers"],["D","Buffers"]
        ]},
        { id: 20, type: "choice", prompt: "Which fat description matches the lecture?", choices: [
          ["A","Cis-unsaturated chains pack tightly and are solid at room temperature"],["B","Saturated fats lack C=C double bonds and are typically solid"],["C","Trans fats cannot pack and stay liquid"],["D","Unsaturated means “saturated with hydrogens”"]
        ]},
      ];

      const answers = {};
      let stage = "start";
      let index = 0;

      const main = document.getElementById("main");
      const count = document.getElementById("count");
      const barwrap = document.getElementById("barwrap");
      const bar = document.getElementById("bar");

      function escapeHtml(s) {
        return String(s).replace(/[&<>"']/g, (c) => {
          if (c === "&") return "&" + "amp;";
          if (c === "<") return "&" + "lt;";
          if (c === ">") return "&" + "gt;";
          if (c === '"') return "&" + "quot;";
          return "&#39;";
        });
      }

      function formatLine(q) {
        const v = (answers[q.id] || "").trim();
        return v ? q.id + " " + v : q.id + " —";
      }

      function canAdvance(q) {
        const v = (answers[q.id] || "").trim();
        if (q.type === "choice") return v.length > 0;
        if (q.type === "short") return v.length > 0;
        return q.items.every(([k]) => new RegExp("(^|,)" + k + "[A-D](,|$)", "i").test(v.replace(/\s/g, "")));
      }

      function parseMatch(value) {
        const out = {};
        String(value || "").split(",").forEach((chunk) => {
          const m = chunk.trim().match(/^(\d+)([A-D])$/i);
          if (m) out[m[1]] = m[2].toUpperCase();
        });
        return out;
      }

      function render() {
        if (stage === "start") {
          count.hidden = true; barwrap.hidden = true;
          main.innerHTML = `
            <section class="card">
              <p style="font-family:var(--display);font-size:1.25rem;color:var(--navy);margin:0">Chemical Foundation of Life</p>
              <p class="muted">Twenty questions, one at a time. Your answers are kept on this page only. The last screen is a simple numbered list — <span style="font-family:var(--mono);color:var(--ink)">1 A</span>, <span style="font-family:var(--mono);color:var(--ink)">2 C</span>, and so on.</p>
              <ul style="margin:1.25rem 0 0; padding-left:1.1rem; color:var(--ink); font-size:0.95rem;">
                <li>Multiple choice records the letter.</li>
                <li>True / false uses A = True, B = False.</li>
                <li>Short answers record the text you type.</li>
              </ul>
              <button class="btn" id="begin" style="margin-top:2rem">Begin</button>
            </section>`;
          document.getElementById("begin").onclick = () => { stage = "quiz"; render(); };
          return;
        }
        if (stage === "done") {
          count.hidden = false; barwrap.hidden = false;
          count.textContent = "Done";
          bar.style.width = "100%";
          const lines = QUESTIONS.map(formatLine);
          main.innerHTML = `
            <section class="card">
              <h2 class="prompt" style="margin-bottom:0.25rem">Your answers</h2>
              <p class="muted">Simple list — question number, then your answer.</p>
              <ol class="list">${lines.map((l) => `<li>${escapeHtml(l)}</li>`).join("")}</ol>
              <div class="row" style="justify-content:flex-start">
                <button class="btn" id="copy">Copy list</button>
                <button class="btn outline" id="restart">Start over</button>
              </div>
            </section>`;
          document.getElementById("copy").onclick = async () => {
            try { await navigator.clipboard.writeText(lines.join(String.fromCharCode(10))); document.getElementById("copy").textContent = "Copied"; } catch {}
          };
          document.getElementById("restart").onclick = () => {
            Object.keys(answers).forEach((k) => delete answers[k]);
            index = 0; stage = "start"; render();
          };
          return;
        }

        const q = QUESTIONS[index];
        count.hidden = false; barwrap.hidden = false;
        count.textContent = (index + 1) + " / " + QUESTIONS.length;
        bar.style.width = ((index) / QUESTIONS.length * 100) + "%";
        const val = answers[q.id] || "";

        let body = "";
        if (q.type === "choice") {
          body = `<div class="choices" role="radiogroup">${q.choices.map(([id, label]) => `
            <label class="opt${val === id ? " selected" : ""}">
              <input type="radio" name="q" value="${id}" ${val === id ? "checked" : ""} />
              <span class="letter">${id}</span>
              <span>${escapeHtml(label)}</span>
            </label>`).join("")}</div>`;
        } else if (q.type === "short") {
          body = `<textarea id="short" placeholder="${escapeHtml(q.placeholder || "")}">${escapeHtml(val)}</textarea>`;
        } else {
          const parsed = parseMatch(val);
          body = `<div class="match">${q.items.map(([k, label]) => `
            <div class="match-row">
              <p><span class="letter">${k}.</span> ${escapeHtml(label)}</p>
              <select data-k="${k}">
                <option value="">Select</option>
                ${q.options.map(([id, lab]) => `<option value="${id}" ${parsed[k]===id?"selected":""}>${id}. ${escapeHtml(lab)}</option>`).join("")}
              </select>
            </div>`).join("")}</div>`;
        }

        main.innerHTML = `
          <section class="card">
            <p class="kicker">Question ${q.id}</p>
            <h2 class="prompt">${escapeHtml(q.prompt)}</h2>
            ${body}
            <div class="row">
              <button class="btn ghost" id="back">Back</button>
              <button class="btn teal" id="next" ${canAdvance(q) ? "" : "disabled"}>${index === QUESTIONS.length - 1 ? "Finish" : "Next"}</button>
            </div>
          </section>`;

        if (q.type === "choice") {
          main.querySelectorAll("input[type=radio]").forEach((el) => {
            el.addEventListener("change", () => { answers[q.id] = el.value; render(); });
          });
        } else if (q.type === "short") {
          document.getElementById("short").addEventListener("input", (e) => {
            answers[q.id] = e.target.value;
            document.getElementById("next").disabled = !canAdvance(q);
          });
        } else {
          main.querySelectorAll("select").forEach((el) => {
            el.addEventListener("change", () => {
              const parsed = parseMatch(answers[q.id] || "");
              parsed[el.getAttribute("data-k")] = el.value;
              answers[q.id] = q.items.map(([k]) => parsed[k] ? k + parsed[k] : "").filter(Boolean).join(",");
              document.getElementById("next").disabled = !canAdvance(q);
            });
          });
        }
        document.getElementById("back").onclick = () => {
          if (index === 0) { stage = "start"; } else { index -= 1; }
          render();
        };
        document.getElementById("next").onclick = () => {
          if (!canAdvance(q)) return;
          if (index >= QUESTIONS.length - 1) stage = "done";
          else index += 1;
          render();
        };
      }

      render();
    </script>
  </body>
</html>
